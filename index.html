<style>
/* Layout: one full-screen 3D view; HUD pinned to the corners like gas-station price stickers. Single committed look (dark, neon). */
:root{
  --ink:#140f1c; --panel:rgba(20,15,28,.78); --paper:#fff7ea;
  --hot:#ff3fa4; --lime:#b6ff3c; --sky:#5fd4ff; --fire:#ff7a1a; --grape:#a070ff;
  --display:'Bungee','Impact','Arial Black',sans-serif;
  --body:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--paper);font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#game{position:relative;width:100%;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated}
.hud{position:absolute;pointer-events:none}
#count{top:10px;left:50%;transform:translateX(-50%);text-align:center;background:var(--panel);padding:6px 18px 8px;border:3px solid var(--hot);rotate:-1.5deg}
#count small{display:block;font-weight:800;letter-spacing:.18em;font-size:11px;color:var(--lime)}
#num{font-family:var(--display);font-size:clamp(34px,7vw,60px);line-height:1;font-variant-numeric:tabular-nums}
#num.bump{color:var(--lime)}
#panic{display:flex;align-items:center;gap:6px;font-weight:800;font-size:9px;letter-spacing:.16em;margin-top:4px}
#panic .bar{flex:1;height:5px;margin:0}#panic .bar i{background:var(--hot);width:0}
#right{top:14px;right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#mult{text-align:right;font-family:var(--display);font-size:22px;color:var(--lime);text-shadow:2px 2px 0 var(--ink)}
#mult small{display:block;font-family:var(--body);font-weight:800;font-size:10px;letter-spacing:.16em;color:var(--paper)}
#radar{width:104px;height:104px;border-radius:50%;border:2px solid var(--paper)}
#powers{top:14px;left:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;width:min(190px,40vw)}
.pw{font-weight:800;font-size:11px;letter-spacing:.06em;padding:4px 8px 5px;background:var(--panel);border-left:6px solid var(--c)}
.pw i{display:block;height:4px;background:var(--c);margin-top:3px}
#vape{bottom:calc(16px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));background:var(--panel);padding:8px 12px;width:min(230px,46vw)}
#vape small{font-weight:800;font-size:10px;letter-spacing:.16em;color:var(--sky)}
#flavor{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#vape{pointer-events:auto;cursor:pointer}#swap{float:right;color:var(--paper);font-weight:800;letter-spacing:.06em}#stock{font-size:11px;font-weight:600;opacity:.8;font-variant-numeric:tabular-nums}
.bar{height:10px;background:rgba(255,255,255,.15);margin-top:6px}
.bar i{display:block;height:100%;width:100%;background:var(--lime)}
#cross{top:50%;left:50%;width:8px;height:8px;margin:-4px;border-radius:50%;border:2px solid var(--paper);opacity:.8}
#prompt{left:50%;top:62%;transform:translateX(-50%);font-weight:800;font-size:16px;background:var(--panel);padding:6px 14px;white-space:nowrap;border-bottom:3px solid var(--lime)}
#lung{left:50%;top:60%;transform:translateX(-50%);width:min(300px,64vw);text-align:center}
#lung small{font-weight:800;font-size:11px;letter-spacing:.14em;text-shadow:1px 1px 0 var(--ink)}
#lung .bar{height:18px;border:2px solid var(--paper);background:linear-gradient(90deg,var(--panel) 0 56%,rgba(182,255,60,.5) 56% 80%,rgba(255,60,60,.55) 80%)}
#lung .bar i{background:var(--paper);width:0;opacity:.9}
#lung.zone .bar i{background:var(--lime)}#lung.over .bar i{background:#ff4a4a}
#toast{left:50%;top:22%;transform:translateX(-50%);font-family:var(--display);font-size:clamp(20px,5vw,40px);text-align:center;color:var(--lime);text-shadow:3px 3px 0 var(--ink);width:90%;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}
#gain{left:50%;top:42%;transform:translateX(-50%);font-family:var(--display);font-size:clamp(18px,4vw,30px);white-space:nowrap;text-shadow:2px 2px 0 var(--ink);opacity:0}
#gain.go{animation:gain 1.1s ease-out}
@keyframes gain{0%{opacity:0;translate:0 10px}15%{opacity:1}100%{opacity:0;translate:0 -60px}}
#hint{left:50%;top:71%;transform:translateX(-50%);max-width:86%;text-align:center;font-weight:600;font-size:14px;background:var(--panel);padding:6px 12px;border-left:4px solid var(--sky)}
#news{left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);color:var(--ink);font-weight:800;font-size:13px;padding:5px 12px;max-width:88%;text-align:center;border-left:8px solid #e0244a;opacity:0;transition:opacity .4s}
#news.on{opacity:1}
#fx{inset:0;transition:box-shadow .3s}
#fx.boost{box-shadow:inset 0 0 90px 20px var(--fire)}
.bub{position:absolute;left:0;top:0;pointer-events:none;background:var(--paper);color:var(--ink);font-weight:800;font-size:13px;padding:3px 9px;border-radius:12px;white-space:nowrap;will-change:transform}
#stick,#vbtn{position:absolute;bottom:calc(96px + env(safe-area-inset-bottom,0px));border-radius:50%;border:3px solid var(--paper);opacity:.55}
#stick{left:max(24px,env(safe-area-inset-left,0px));width:110px;height:110px}
#stick i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:var(--paper)}
#vbtn{right:max(24px,env(safe-area-inset-right,0px));width:104px;height:104px;background:var(--hot);color:var(--paper);font-family:var(--display);font-size:20px;opacity:.85}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;background:rgba(20,15,28,.82);padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ov h1{font-family:var(--display);font-size:clamp(40px,11vw,104px);line-height:.9;margin:0;color:var(--hot);text-shadow:4px 4px 0 var(--lime);rotate:-2deg;text-wrap:balance}
.ov p{margin:0;font-size:clamp(16px,3.2vw,24px);font-weight:600;max-width:30ch;text-wrap:balance}
.line{opacity:0;animation:in .5s forwards}
.line:nth-of-type(1){animation-delay:.3s;font-family:var(--display);font-size:clamp(26px,6vw,48px);color:var(--lime)}
.line:nth-of-type(2){animation-delay:1.3s}.line:nth-of-type(3){animation-delay:2.6s}
.line:nth-of-type(4){animation-delay:3.6s;color:var(--hot);font-weight:800;letter-spacing:.14em;text-transform:uppercase}
@keyframes in{from{opacity:0;translate:0 12px}to{opacity:1;translate:0 0}}
@media (prefers-reduced-motion:reduce){.line{animation-duration:.01s}}
.ov button{font-family:var(--display);font-size:22px;padding:12px 28px;background:var(--lime);color:var(--ink);border:0;cursor:pointer;box-shadow:5px 5px 0 var(--hot);margin-top:8px}
.ov button:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
.how{font-size:13px!important;font-weight:400!important;opacity:.85;max-width:48ch!important}
#stats{font-variant-numeric:tabular-nums}
@media (max-width:520px){#radar{width:78px;height:78px}#prompt{font-size:13px}}
</style>

</head>
<body>
<div id="game">

    <button id="again">Clock in again</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
